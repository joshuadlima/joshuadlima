name: Markdown to SVG

on:
  push:
    paths:
      - "sections/**.md"
      - "sections/**.txt"
      - "scripts/md2svg.py"
  workflow_dispatch:        # run it manually from the Actions tab

permissions:
  contents: write           # needed so the bot can commit the SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        run: |
          for f in sections/*.md; do
            python scripts/md2svg.py "$f" "${f%.md}.svg"
          done

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/*.svg
          git diff --staged --quiet || git commit -m "chore: regenerate SVGs"
          git push